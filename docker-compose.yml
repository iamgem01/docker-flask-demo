
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: flask-docker-demo

    ports:
      - "127.0.0.1:5000:8000"

    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
