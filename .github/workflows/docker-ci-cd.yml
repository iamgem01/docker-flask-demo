
name: Docker CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t docker-flask-demo:test .

      - name: Run container
        run: |
          docker run -d \
            --name flask-ci-test \
            -p 127.0.0.1:5000:8000 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            docker-flask-demo:test

      - name: Test endpoints and QR generation
        run: |
          set -eu

          # Wait for the home endpoint
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error \
                http://127.0.0.1:5000/ -o /tmp/home.json; then
              break
            fi

            if [ "$attempt" -eq 20 ]; then
              echo "Home endpoint failed"
              docker ps -a
              docker logs flask-ci-test
              exit 1
            fi

            sleep 2
          done

          echo "Home endpoint:"
          cat /tmp/home.json
          grep -q '"status": "running"' /tmp/home.json

          # Check health endpoint
          curl --fail --silent --show-error \
            --retry 5 --retry-connrefused --retry-delay 2 \
            http://127.0.0.1:5000/health -o /tmp/health.json

          echo "Health endpoint:"
          cat /tmp/health.json
          grep -q '"status": "healthy"' /tmp/health.json

          # Check QR page
          curl --fail --silent --show-error \
            http://127.0.0.1:5000/qr -o /tmp/qr-page.html

          grep -q "Tạo mã QR của bạn" /tmp/qr-page.html
          echo "QR page test passed"

          # Submit content and verify a QR image is returned
          curl --fail --silent --show-error \
            --retry 3 --retry-connrefused --retry-delay 2 \
            -X POST \
            --data-urlencode "content=https://github.com/iamgem01/docker-flask-demo" \
            http://127.0.0.1:5000/qr -o /tmp/qr-result.html

          grep -q "data:image/png;base64," /tmp/qr-result.html
          grep -q "Tải ảnh PNG" /tmp/qr-result.html
          echo "QR generation test passed"

      - name: Show logs on failure
        if: failure()
        run: docker logs flask-ci-test || true

      - name: Clean up
        if: always()
        run: docker rm -f flask-ci-test || true

  publish:
    name: Publish image to GHCR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
